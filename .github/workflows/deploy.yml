name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            BuildTwin360/package-lock.json

      - name: Install Dependencies
        run: |
          if [ -d "BuildTwin360" ]; then
            echo "Installing dependencies inside BuildTwin360..."
            cd BuildTwin360 && npm install
          else
            echo "Installing dependencies at root..."
            npm install
          fi

      - name: Build Project
        run: |
          if [ -d "BuildTwin360" ]; then
            echo "Building Vite project inside BuildTwin360..."
            cd BuildTwin360 && npm run build
          else
            echo "Building Vite project at root..."
            npm run build
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Determine artifact path
        id: set-path
        run: |
          if [ -d "BuildTwin360/dist" ]; then
            echo "dist_path=./BuildTwin360/dist" >> $GITHUB_OUTPUT
          else
            echo "dist_path=./dist" >> $GITHUB_OUTPUT
          fi

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.set-path.outputs.dist_path }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
